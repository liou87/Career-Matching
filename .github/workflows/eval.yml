name: Eval

# 离线评测会调用真实 LLM、产生费用，只手动触发，不随 push 运行。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置 DEEPSEEK_API_KEY。
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 要评测的版本，空格分隔（v1 v2 v3）
        default: v3
      runs:
        description: 每个岗位跑几遍
        default: "3"
      judge:
        description: 是否做编造检测
        type: boolean
        default: true

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 输入通过环境变量传给命令，不直接拼进脚本
          VERSIONS: ${{ inputs.versions }}
          RUNS: ${{ inputs.runs }}
          JUDGE_FLAG: ${{ inputs.judge && '' || '--no-judge' }}
        run: python -m evals.run --versions $VERSIONS --runs "$RUNS" $JUDGE_FLAG
      - name: Publish summary
        run: cat evals/results/eval_*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results/eval_*
